[package]
name = "cce-documents"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "3e1d0143dc5202c5c8c158eeff834798f74a5b4c" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# Decodes the PNG pages pdftoppm writes; pictures are cce-image's.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
