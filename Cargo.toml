[package]
name = "cce-documents"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "4f2148443a78a10c9995ac154fbcd867796862b6" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# Decodes the PNG pages pdftoppm writes; pictures are cce-image's.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
# PDFium, loaded at runtime from ~/.local/lib (scripts/fetch-pdfium). The
# API version is pinned to the newest pdfium-render knows; the fetched build
# may be newer, which PDFium's stable C API allows.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
