[package]
name = "cce-documents"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "2d3d97a05ee4e15a409c19a6ac09c2658d2959bf" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# Decodes the PNG pages pdftoppm writes; pictures are cce-image's.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
